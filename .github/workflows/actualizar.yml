name: Actualizar fútbol boliviano

on:
  schedule:
    - cron: "0 12 * * *"  # 08:00 America/La_Paz (UTC-4)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Scrapea las 20 fuentes, guarda data/futbol_boliviano.json y lo sube a
      # Supabase. Si faltan los secrets, el script avisa y solo genera el JSON.
      - name: Ejecutar actualizador
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python actualizador_futbol_boliviano.py

      # if: always() para que el JSON se commitee aunque la subida a Supabase
      # haya fallado: en ese caso el paso de arriba queda en rojo y te enterás,
      # pero los datos scrapeados no se pierden.
      - name: Commit y push del JSON generado
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/futbol_boliviano.json
          git diff --cached --quiet && echo "Sin cambios" || git commit -m "Actualizar futbol_boliviano.json [skip ci]"
          git push
