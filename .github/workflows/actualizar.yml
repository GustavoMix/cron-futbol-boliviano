name: Actualizar fútbol boliviano

on:
  schedule:
    # Cada 2 horas entre las 08:00 y las 00:00 de Bolivia (UTC-4).
    - cron: "7 0,2,4,12,14,16,18,20,22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar actualizador
        run: python actualizador_futbol_boliviano.py

      - name: Commit y push del JSON generado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/futbol_boliviano.json data/app.json
          git diff --cached --quiet && echo "Sin cambios" || git commit -m "Actualizar futbol_boliviano.json [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push
